#Se define el n\u00c3\u00bamero de puerto del servidor
server.port=80

#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar el r\u00c3\u00b3tulo de "spring" que sale al inicio
spring.main.banner-mode=off

#Para actualizar las p\u00c3\u00a1ginas r\u00c3\u00a1pido, en desarrollo el "cache" del servidor (false), en producci\u00c3\u00b3n "true"
spring.thymeleaf.cache=false

